name: Bug report
description: Report a reproducible problem in a workflow or action
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the automation toolbox.
  - type: input
    id: component
    attributes:
      label: Workflow or action
      description: Which reusable workflow or composite action is affected?
      placeholder: .github/workflows/ci-node.yml
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the unexpected behaviour and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the caller snippet, inputs, event, and relevant log excerpt.
    validations:
      required: true
  - type: input
    id: ref
    attributes:
      label: Version or commit
      description: Which tag, branch, or commit SHA was used?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add anything else that may help diagnose the problem.
