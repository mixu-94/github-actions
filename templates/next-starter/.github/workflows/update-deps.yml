name: Update dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    uses: mixu-94/github-actions/.github/workflows/update-npm-dependencies.yml@d2326f4fd069304b4e74968471b83ca2c9142ae7 # v1 baseline
    with:
      node-version: "20.x"
      update-target: patch
      run-tests: false
      run-typecheck: true
      run-build: false
